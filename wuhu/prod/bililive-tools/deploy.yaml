apiVersion: v1
kind: ConfigMap
metadata:
  name: bililive-tools-caddy
  namespace: bililive-tools
data:
  Caddyfile: |
    :3000 {
      handle_path /api* {
        @videoNoRange {
          path /common/video/*
          not header Range *
        }
        request_header @videoNoRange Range "bytes=0-"
        reverse_proxy localhost:18010
      }
      handle {
        root * /app/public
        file_server
        encode gzip
        try_files {path} /index.html
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bililive-tools
  namespace: bililive-tools
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bililive-tools
  template:
    metadata:
      labels:
        app: bililive-tools
    spec:
      volumes:
      - name: data-volume
        persistentVolumeClaim:
          claimName: data-pvc
      - name: video-volume
        persistentVolumeClaim:
          claimName: video-pvc
      - name: fonts-volume
        persistentVolumeClaim:
          claimName: fonts-pvc
      - name: caddy-config
        configMap:
          name: bililive-tools-caddy
      containers:
      - name: bililive-tools
        image: renmu1234/bililive-tools:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        env:
        - name: BILILIVE_TOOLS_PASSKEY
          value: "your_passkey"
        - name: BILILIVE_TOOLS_BILIKEY
          value: "your_bilikey"
        - name: TZ
          value: "Asia/Shanghai"
        volumeMounts:
        - name: data-volume
          mountPath: /app/data
        - name: video-volume
          mountPath: /app/video
        - name: fonts-volume
          mountPath: /usr/local/share/fonts
        - name: caddy-config
          mountPath: /etc/caddy/Caddyfile
          subPath: Caddyfile
          readOnly: true
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: bililive-tools-service
  namespace: bililive-tools
spec:
  selector:
    app: bililive-tools
  ports:
  - port: 3000
    targetPort: 3000
    nodePort: 32610
  type: NodePort
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data-pvc
  namespace: bililive-tools
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: video-pvc
  namespace: bililive-tools
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fonts-pvc
  namespace: bililive-tools
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 100Mi
